name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation
      - run: npm run render:smoke
      - run: npm run render:motion-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: render-smoke
          path: out/
